<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} | CreditGuard AI</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0e1a;color:#f1f5f9;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(560px,calc(100% - 2rem));padding:2rem;border:1px solid #27344d;border-radius:18px;background:#111827;box-shadow:0 18px 60px #0008}.code{color:#8ea7ff;font-size:4rem;font-weight:800;line-height:1}.muted{color:#b6c2d4}.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}a{padding:.65rem .9rem;border-radius:8px;color:#fff;text-decoration:none;background:#536dff;font-weight:700}a.secondary{background:#1e293b}
  </style>
</head>
<body><main class="card"><div class="code">{{ code }}</div><h1>{{ title }}</h1><p class="muted">{{ message }}</p><div class="actions"><a href="/">Return to dashboard</a><a class="secondary" href="/guide">Read the project guide</a></div></main></body>
</html>
